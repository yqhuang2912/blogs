<div class="post-header">
    <div class="post-date-badge">
        <div class="badge-day">{{DAY}}</div>
        <div class="badge-month">{{MONTH}}</div>
    </div>
    <div class="post-header-content">
        {{TITLE_ELEMENT}}
        <div class="{{META_CLASS}}">
            {{META}}
            <button type="button" class="download-pdf-btn" data-download-pdf aria-label="将本文保存为 PDF"
                hidden>下载 PDF</button>
        </div>
    </div>
</div>
